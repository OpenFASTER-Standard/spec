name: Build OpenFASTER site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (WeasyPrint's native libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1 libcairo2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r documentation/requirements-spec.txt -r streamld/tests/requirements.txt
          bikeshed update

      - name: Build MiKaDiv-VIB Request (XSD -> generated include -> Excel template)
        run: python generate_template.py

      - name: Build MiKaDiv-VIB Response (XSD -> generated include)
        run: PYTHONPATH=. python mikadiv-vib/generate_response_docs.py

      - name: Build KaFE Excel template (XSD + status codes -> generated include -> Excel template)
        run: python generate_template.py

      - name: Build KaFE RM receipt docs
        run: python -m kafe.generate_rm_docs

      - name: Build KaFE status-code appendix
        run: python -m kafe.generate_status_codes_docs

      - name: Build KaFE VA docs
        run: python -m kafe.generate_va_docs

      - name: Build StreamLD (SHACL -> generated include + JSON Schema)
        run: PYTHONPATH=streamld python -m generator.generate_streamld_docs

      - name: Regenerate header boilerplate (embeds the changelog)
        run: python documentation/prepare_spec.py

      - name: Build documentation/about.html
        run: bikeshed --allow-nonlocal-files --die-on=link-error spec documentation/about.bs documentation/about.html

      - name: Read KaFE version
        id: kafe_version
        run: echo "version=$(python -m engine.version kafe/request.bs)" >> "$GITHUB_OUTPUT"

      - name: Build kafe/index.html
        run: bikeshed --allow-nonlocal-files --die-on=link-error spec kafe/index.bs kafe/index.html

      - name: Build kafe/request.html + PDF
        run: |
          bikeshed --allow-nonlocal-files --die-on=link-error spec kafe/request.bs kafe/request.html
          weasyprint --stylesheet documentation/print.css kafe/request.html kafe/generated/kafe-v${{ steps.kafe_version.outputs.version }}.pdf

      - name: Build kafe/response.html
        run: bikeshed --allow-nonlocal-files --die-on=link-error spec kafe/response.bs kafe/response.html

      - name: Read MiKaDiv-VIB version
        id: mikadiv_vib_version
        run: echo "version=$(python -m engine.version mikadiv-vib/request.bs)" >> "$GITHUB_OUTPUT"

      - name: Build mikadiv-vib/index.html
        run: bikeshed --allow-nonlocal-files --die-on=link-error spec mikadiv-vib/index.bs mikadiv-vib/index.html

      - name: Build mikadiv-vib/request.html + PDF
        run: |
          bikeshed --allow-nonlocal-files --die-on=link-error spec mikadiv-vib/request.bs mikadiv-vib/request.html
          weasyprint --stylesheet documentation/print.css mikadiv-vib/request.html mikadiv-vib/generated/mikadiv-vib-v${{ steps.mikadiv_vib_version.outputs.version }}.pdf

      - name: Build mikadiv-vib/response.html
        run: bikeshed --allow-nonlocal-files --die-on=link-error spec mikadiv-vib/response.bs mikadiv-vib/response.html

      - name: Build streamld/index.html
        run: bikeshed --allow-nonlocal-files --die-on=link-error spec streamld/index.bs streamld/index.html

      - name: Build StreamLD's 4 documents
        run: |
          bikeshed --allow-nonlocal-files --die-on=link-error spec streamld/core.bs streamld/core.html
          bikeshed --allow-nonlocal-files --die-on=link-error spec streamld/subscription.bs streamld/subscription.html
          bikeshed --allow-nonlocal-files --die-on=link-error spec streamld/binding-sse.bs streamld/binding-sse.html
          bikeshed --allow-nonlocal-files --die-on=link-error spec streamld/binding-websocket.bs streamld/binding-websocket.html

      - name: Run streamld's own test suite
        run: |
          pip install -r streamld/tests/requirements.txt
          python -m pytest streamld/tests/

      - name: Commit regenerated output (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html mikadiv-vib/index.html mikadiv-vib/request.html mikadiv-vib/response.html mikadiv-vib/generated/ documentation/about.html documentation/header.include mikadiv-vib/header.include streamld/header.include streamld/index.html streamld/core.html streamld/subscription.html streamld/binding-sse.html streamld/binding-websocket.html streamld/generated/ kafe/index.html kafe/request.html kafe/response.html kafe/generated/ kafe/header.include
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild site [skip ci]"
            git push
          fi

  check-generated-up-to-date:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (WeasyPrint's native libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1 libcairo2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r documentation/requirements-spec.txt -r streamld/tests/requirements.txt
          bikeshed update

      - name: Check generated output is up to date
        id: check
        run: |
          if ci/check-generated-up-to-date.sh; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit regenerated output onto this PR branch
        if: steps.check.outputs.stale == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate build output to match source changes"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Report result
        run: |
          if [ "${{ steps.check.outputs.stale }}" = "true" ]; then
            echo "::warning::Generated output was stale relative to this PR's source changes -- it has been auto-corrected in a new commit on this branch. Pull the latest commit before merging."
          else
            echo "Generated output already matches source. Nothing to do."
          fi
